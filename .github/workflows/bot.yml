name: Telegram Downloader Bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U "yt-dlp[default]" requests

      - name: Write cookies (optional)
        env:
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
        run: |
          if [ -n "$COOKIES_TXT" ]; then echo "$COOKIES_TXT" > cookies.txt; fi

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          ADMIN_IDS: ${{ vars.ADMIN_IDS }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID }}
          CHANNEL_URL: ${{ vars.CHANNEL_URL }}
          STORAGE_CHAT: ${{ vars.STORAGE_CHAT }}
          LOG_CHAT: ${{ vars.LOG_CHAT }}
          RATE_LIMIT: "5"
          RUN_SECONDS: "21300"
        run: python bot.py
      
